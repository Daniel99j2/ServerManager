[package]
name = "ServerManager"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version = "*"}
tokio = {version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "process"]}
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
tower-http = {version = "0.7.1", features = ["fs"]}
mc-rpc = "0.2.0+3.1.0"
async-stream = "0.3.6"
serde_json = "1.0.151"
tower = "0.5.3"
urlencoding = "2.1.3"
rand = "0.9.5"
hex = "0.4.3"
axum-extra = { version = "0.12.6", features = ["cookie"] }
include_dir = "0.7.4"
