[package]
name = "ServerManager"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version = "*"}
tokio = {version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "process"]}
futures-util = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
mc-rpc = "0.2.0"
mc-rcon = "0.1.1"
async-stream = "0.3.6"
serde_json = "1.0.151"
urlencoding = "2.1.3"
rand = "0.9.5"
axum-extra = { version = "0.12.6", features = ["cookie"] }
include_dir = "0.7.4"
reqwest = "0.13.5"
flate2 = "1.1.10"

[build-dependencies]
build-print = "1.0.1"
