<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account</title>
    <link rel="stylesheet" href="main.css">
    <link rel="icon" type="image/x-icon" href="icon.svg">
</head>
<body customproperties withsidebar aligntop>
<script src="main_data.js"></script>
<script src="animate_late.js"></script>
<script type="text/javascript">
    document.addEventListener("status_update", (event) => {
        document.getElementById("current-status-circle").style["background-color"] = event.detail.status_colour;
        document.getElementById("current-status-circle").style["outline-color"] = event.detail.status_colour;
        document.getElementById("current-status").textContent = event.detail.status;
        if (event.detail.status_online) {
            document.getElementById("start-stop").className = "redbutton"
            document.getElementById("start-stop").innerHTML = '<svgfrom src="stop.svg"></svgfrom> Stop'
            let tps = event.detail.tps.toFixed(1);
            if(tps === "-500.0") tps = "???";
            document.getElementById("status-text").innerHTML = '<svgfrom src="users.svg"></svgfrom> '+event.detail.players_online+'/'+event.detail.max_players+'　•　 <svgfrom src="gauge.svg"></svgfrom> '+tps;
        } else {
            document.getElementById("start-stop").className = "greenbutton"
            document.getElementById("start-stop").innerHTML = '<svgfrom src="power.svg"></svgfrom> Start'
            document.getElementById("status-text").innerHTML = '-';
        }
    });
    async function startStop(event) {
        const request = new XMLHttpRequest();
        request.open("POST", latest_data.status_online ? "api/stop_server" : "api/start_server");
        request.onload = async function () {
            if(request.status === 200) {
            }
        }
        request.send();
    }

    async function reboot(event) {
        const request = new XMLHttpRequest();
        request.open("POST", "api/reboot_server");
        request.send();
    }

    async function kill(event) {
        const request = new XMLHttpRequest();
        request.open("POST", "api/kill_server");
        request.send();
    }
</script>
<h1>Dashboard</h1>
<div class="dashboard-status" style="height: auto; width: 10vw; border: solid 4px var(--border); border-radius: 4px; margin: 0">
    <div id="current-status-circle" style="height: 4vh; width: 10vw; outline: solid 4px var(--border); border-radius: 4px 4px 0 0; justify-content: center; align-content: center">
        <h3 id="current-status" style="margin: 0; text-align: center"></h3>
    </div>
    <div style="position: relative; height: auto; width: 10vw; justify-content: center; align-items: center; display: flex; flex-direction: column">
        <p style="text-align: center; height: 1em" id="status-text"></p>
        <div style="display: flex; flex-direction: row">
            <button class="greybutton" id="start-stop" onclick="startStop()" style="width: 120px;">Start</button>
            <button class="utility-button" onclick="reboot()"><svgfrom src="refresh-cw.svg"></svgfrom></button>
            <button class="utility-button" onclick="kill()" id="kill-server"><svgfrom src="skull.svg"></svgfrom></button>
        </div>
    </div>
</div>
<div class="dashboard-grid" id="dashboard-grid" style="display: flex; flex-direction: row">
    <div class="dashboard-column">
        <div class="dashboard-box">
            <h2 class="dashboard-header">Players</h2>
            <div id="player-list"></div>
        </div>
        <div class="dashboard-box">
            <h2 class="dashboard-header">Options</h2>
        </div>
    </div>
    <div class="dashboard-column" style="overflow: hidden;">
        <div class="dashboard-box" style="overflow: hidden;">
            <h2 class="dashboard-header">Log</h2>
            <div id="logDiv" style="overflow-y: auto; height: 90%" class="log-box">
            </div>
        </div>
    </div>
</div>
</body>
</html>
