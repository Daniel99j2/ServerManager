<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account</title>
    <link rel="stylesheet" href="main.css">
    <link rel="icon" type="image/x-icon" href="icon.png">
</head>
<body>
<script type="text/javascript">
    let generalStream = new EventSource("api/live_updates", {
        withCredentials: true
    });
    let running = false;
    generalStream.onmessage = (event) => {
        let data = JSON.parse(event.data);
        document.getElementById("current-status-circle").style["background-color"] = data.status_colour;
        document.getElementById("current-status").textContent = data.status;
        running = data.status_online;
        if(running) {
            document.getElementById("start-stop").className = "redbutton"
            document.getElementById("start-stop").textContent = "Stop"
        } else {
            document.getElementById("start-stop").className = "greenbutton"
            document.getElementById("start-stop").textContent = "Start"
        }
        console.log(data)
    };
    generalStream.onerror = (error) => {
        console.error("Error in EventSource:", error);
    };

    async function startStop(event) {
        const request = new XMLHttpRequest();
        request.open("POST", running ? "api/stop_server" : "api/start_server");
        request.onload = async function () {
            if(request.status === 200) {
            }
        }
        request.send();
    }
</script>
<h1>Dashboard</h1>
<div style="display: flex; align-items: center; gap: 10px;">
<div class="circle" style="width: 10px; height: 10px; background-color: grey; border-radius: 50%;" id="current-status-circle"></div><p id="current-status">Offline</p>
</div>
<div class="dashboard-grid" id="dashboard-grid">
    <div class="dashboard-column">
        <div class="dashboard-box">
            <h2 class="dashboard-header">Players</h2>
            <div id="player-list"></div>
        </div>
        <div class="dashboard-box">
            <h2 class="dashboard-header">Options</h2>
            <button class="greybutton" id="start-stop" onclick="startStop()">Start</button>
        </div>
    </div>
    <div class="dashboard-column" style="overflow: hidden;">
        <div class="dashboard-box" style="overflow: hidden;">
            <h2 class="dashboard-header">Log</h2>
            <div id="logDiv" style="overflow-y: auto; height: 90%" class="log-box">
            </div>
        </div>
    </div>
</div>
</body>
</html>
