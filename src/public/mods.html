<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mods</title>
    <link rel="stylesheet" href="main.css">
    <link rel="icon" type="image/x-icon" href="icons/icon.svg">
</head>
<body customproperties withsidebar aligntop>
<script src="main_data.js"></script>
<script src="animate_late.js"></script>
<h1>Mods</h1>
<div style="display: flex; flex-direction: row">
    <button class="greenbutton" onclick="get_updates(event)"><svgfrom src="refresh-cw.svg"></svgfrom> Check for updates</button>
    <button class="greenbutton" onclick="update_all(event)" disabled id="update-all"><svgfrom src="download.svg"></svgfrom> Update All</button>
    <button class="greenbutton" onclick="install_mods(event)"><svgfrom src="download.svg"></svgfrom> Install mods...</button>
</div>
<div style="height: auto; width: auto; border: solid 4px var(--border); border-radius: 4px; margin: 0" id="mod-holder">
</div>
</body>
<script type="text/javascript">
    async function reloadMods() {
        request("GET", "api/installed_mods", async (out) => {
            if(out.success) {
                let val = out.as_json();
                let mods = val[0];
                console.log(mods)
                document.getElementById("mod-holder").replaceChildren();
                for (let mod of mods) {
                    add_mod(mod, null, 0);
                }
                let already_done = [];
                for (let duplicate of val[1]) {
                    if(already_done.includes(duplicate)) {
                        continue;
                    }
                    already_done.push(duplicate);
                    let child = document.createElement("div");
                    child.classList.add("mod-list-element");
                    child.style.borderColor = "#ffa600";
                    child.style.backgroundColor = "#806600";
                    child.style.flexDirection = "column";
                    child.style.marginBottom = "5px";
                    child.style.justifyContent = "center";
                    let header = document.createElement("h3");
                    header.style.margin = "0px";
                    header.textContent = "Warning: Duplicate mods";
                    let text = document.createElement("p");
                    text.style.margin = "0px";
                    let mod_name = "Unknown";
                    for (let mod of mods) {
                        if(mod.hash === duplicate) {
                            mod_name = mod.name;
                            break;
                        }
                    }
                    text.textContent = "Mod '"+mod_name+"' is duplicated and may cause problems!";
                    child.appendChild(header);
                    child.appendChild(text);
                    document.getElementById("mod-holder").prepend(child);
                }
            }
        });

        //let mods = [{id: "lithium", name: "Lithium", file_name: "lithium-1.0.0.jar", needs_update: true, version: "1.0.0", icon: "https://cdn.modrinth.com/data/gvQqBUqZ/icon.png"}, {id: "carpet", name: "Carpet Mod", file_name: "fabric-carpet-latest.jar", needs_update: false, version: "1.2.0", icon: "https://cdn.modrinth.com/data/gvQqBUqZ/icon.png"}];
    }

    function add_mod(mod, to, indent) {
        let child = document.createElement("div");
        child.id = "mod_"+mod.hash+"_"+indent;
        child.classList.add("mod-list-element");
        let indent_element = document.createElement("h1");
        indent_element.style.marginLeft = indent+"em";
        child.appendChild(indent_element);
        let pic = document.createElement("img");
        pic.style = "width: auto; height: auto; padding: 10px";
        pic.style.imageRendering = "pixelated";
        if(mod.icon.length == 0) {
            pic.src = "https://cdn.modrinth.com/data/7EyjyjZ4/277b2a129eace8bfcc8a49054db2108a7aacf97a.png";
        } else pic.src = mod.icon;
        child.appendChild(pic);
        let nameVersion = document.createElement("div");
        let h3 = document.createElement("h3");
        h3.textContent = mod.name;
        h3.style.margin = "0px";
        nameVersion.style.padding = "10px";
        nameVersion.style.maxWidth = "fit-content";
        nameVersion.style.overflow = "clip";
        nameVersion.appendChild(h3);
        let version = document.createElement("p");
        version.textContent = mod.version;
        version.style.margin = "0px";
        version.style.color = "grey";
        version.style.whiteSpace = "nowrap";
        nameVersion.appendChild(version);
        let filenameAuthors = document.createElement("div");
        filenameAuthors.style.marginTop = "auto";
        filenameAuthors.style.marginBottom = "auto";
        filenameAuthors.style.position = "sticky";
        filenameAuthors.style.left = "40%";
        let filename = document.createElement("p");
        filename.textContent = mod.file_name;
        filename.style.margin = "0px";
        filename.style.color = "grey";
        filename.style.whiteSpace = "nowrap";
        filenameAuthors.appendChild(filename);
        let authors = document.createElement("p");
        authors.textContent = mod.authors;
        authors.style.margin = "0px";
        authors.style.color = "grey";
        authors.style.whiteSpace = "nowrap";
        filenameAuthors.appendChild(authors);

        let button = createElement(`<svgfrom src="check.svg"></svgfrom>`);
        button.classList.add("update_button");

        child.appendChild(nameVersion);
        child.appendChild(filenameAuthors);
        if(mod.children.length > 0) {
            let expand = createElement(`<svgfrom src="chevron-left.svg"></svgfrom>`);

            expand.classList.add("expand-child-mods");
            expand.title = "This mod has embedded jars. Click to expand.";

            let my_children = [];

            let hide;
            let open = async function () {
                expand = replaceElement(expand, `<svgfrom src="loader.svg"></svgfrom>`);
                groupSvg(expand).classList.add("spinner");
                expand.title = "Loading...";
                expand.style.cursor = "not-allowed";
                expand.style.filter = "brightness(0.7)";
                expand.classList.add("expand-child-mods");
                request_params("GET", "api/mod_children", {
                    hash: mod.hash
                }, async (out) => {
                    if(out.success) {
                        let mods = out.as_json();
                        console.log(mods)
                        for (let mod of mods) {
                            my_children.push(add_mod(mod, child, indent+1));
                        }
                        expand = replaceElement(expand, `<svgfrom src="chevron-down.svg"></svgfrom>`);
                        expand.title = "This mod has embedded jars. Click to hide.";
                        expand.onclick = hide;
                        expand.classList.add("expand-child-mods");
                    } else hide();
                });
            };
            hide = async function () {
                expand = replaceElement(expand, `<svgfrom src="chevron-left.svg"></svgfrom>`);
                expand.classList.add("expand-child-mods");
                expand.title = "This mod has embedded jars. Click to expand.";
                for (let c of my_children) {
                    c.parentElement.removeChild(c);
                }
                my_children = [];
                expand.onclick = open;
            };
            expand.onclick = open;

            if(indent !== 0) {
                expand.onclick = null;
                expand.style.cursor = "not-allowed";
                expand.style.filter = "brightness(0.7)";
                expand.title = "You cannot see embedded jars in a embedded jar.";
            }

            button.style.marginLeft = "1em";
            child.appendChild(expand);
        }
        child.appendChild(button);
        if(to != null) to.after(child);
        else document.getElementById("mod-holder").appendChild(child);

        return child;
    }

    async function update_all(event) {
        request_data("POST", "api/update_mods", needs_update, async (out) => {
            await reloadMods();
        });
    }

    async function install_mods(event) {
        window.location.assign("add_mods");
    }

    let needs_update = [];

    async function get_updates(event) {
        request("GET", "api/mod_updates", async (out) => {
            if (out.success) {
                needs_update = [];
                let to_update = out.as_json();
                document.getElementById("update-all").disabled = to_update.length === 0;
                for (const [hash, mod] of Object.entries(to_update)) {
                    console.log("mod_"+hash+"_0");
                    console.log(mod);
                    let holder = document.getElementById("mod_"+hash+"_0");
                    let update_button = holder.querySelectorAll(".update_button")[0];
                    update_button = replaceElement(update_button, `<svgfrom src="download.svg"></svgfrom>`);
                    let data = {
                        hash: hash,
                        file: mod.recent_update
                    };
                    update_button.onclick = async function () {
                        const request = new XMLHttpRequest();
                        request.open("POST", "api/update_mods");
                        request.setRequestHeader("Content-Type", "application/json");
                        request.send(JSON.stringify([data]));
                        request.onload = async function () {
                            await reloadMods();
                        }
                    };
                    needs_update.push(data);
                    update_button.classList.add("update_button");
                    update_button.style.background = "#04AA6D";
                    update_button.style.outlineColor = "#04AA6D";
                    if(holder.querySelectorAll(".expand-child-mods").length > 0) {
                        update_button.style.marginLeft = "1em";
                    }
                }
            }
        });
    }

    for (let i = 0; i < 10; i++) {
        add_mod({icon: "", hash: "", modrinth_info: null, name: "...", file_name: "...", children: []}, null);
    }

    reloadMods();
</script>
</html>
