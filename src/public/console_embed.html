<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Console</title>
    <link rel="stylesheet" href="main.css">
</head>
<script src="animate_late.js"></script>
<script src="main_data.js"></script>
<script type="text/javascript">
    async function run_command(event) {
        event.preventDefault();
        const secret = document.getElementById("command").value;

        const request = new XMLHttpRequest();
        request.open("POST", "api/send_command");
        request.send(secret);
    }

    document.addEventListener("status_update", (event) => {
        document.getElementById("run").disabled = !event.detail.status_online
    });

    let logsStream = new EventSource("api/live_logs", {
        withCredentials: true
    });
    logsStream.onmessage = (event) => {
        let setScroll = false;
        let oldHeight = document.getElementById("log-div").clientHeight;
        if ((document.getElementById("log-div").scrollTop) / (document.getElementById("log-div").scrollHeight - document.getElementById("log-div").clientHeight) === 1) setScroll = true;

        const lines = event.data.replaceAll("\\n", "\n").split("\n");

        lines.forEach((line) => {
            if(line === "#### CLEAR MANAGER LOGS ####") {
                document.getElementById('log-div').replaceChildren();
            } else {
                let slash = line.indexOf("/");
                let prefix = line.substring(slash + 1, line.indexOf("]", slash));
                let style = "";
                if (prefix === "INFO") {
                    style = "color: lime";
                } else if (prefix === "WARN") {
                    style = "color: orange";
                } else if (prefix === "FATAL") {
                    style = "color: red; background: #5d0202";
                } else if (prefix === "ERROR") {
                    style = "color: red";
                }
                let element = document.createElement('p');
                element.textContent = line;
                element.style = style + "; margin: 2px";
                document.getElementById('log-div').appendChild(element);
            }
        })

        if (oldHeight !== document.getElementById("log-div").scrollHeight && !document.getElementById("log-div").dataset.hasScrolled) {
            setScroll = true;
            document.getElementById("log-div").dataset.hasScrolled = true;
        }
        if (setScroll) document.getElementById("log-div").scrollTop = 9999999999;
    };
    logsStream.onerror = (error) => {
        console.error("Error in EventSource:", error);
    };
</script>
<body>
<div style="border: 2px solid var(--border);border-radius: 4px;display: flex;flex-direction: column;position: fixed;inset: 0;box-sizing: border-box;">
    <div style="height: calc(100vh - 60px); border-bottom: 2px solid var(--border)">
        <div style="overflow-y: auto; max-height: 100%; height: 100000000px" id="log-div">
            <p>Test <svgfrom src="trash.svg"></svgfrom> World</p>
            <p>Test 🔥 World</p>
        </div>
    </div>
    <div style="min-height: 20px; border-bottom: 2px solid var(--border);">
        <form onSubmit="run_command(event)" style="display: flex; flex-direction: row; min-width: 100%">
            <label for="command"></label><input type="text" name="command" id="command" placeholder="/..." autocomplete="off" style="border: #00000000; background: #00000000; flex-grow: 1;">
            <button type="submit" style="min-width: 80px; max-width: 80px; border: none; background: #00000000; color: #ffffff" id="run">
                <svgfrom src="send-horizontal.svg"></svgfrom>
            </button>
        </form>
    </div>
</div>
</body>
</html>
