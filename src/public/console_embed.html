<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Console</title>
    <link rel="stylesheet" href="main.css">
</head>
<script src="animate_late.js"></script>
<script src="main_data.js"></script>
<body>
<div style="border: 2px solid var(--border);border-radius: 4px;display: flex;flex-direction: column;position: fixed;inset: 0;box-sizing: border-box;">
    <div style="height: calc(100vh - 60px); border-bottom: 2px solid var(--border)" id="log-size">
        <div style="overflow-y: auto; max-height: 100%; height: 100000000px" id="log-div">
        </div>
    </div>
    <div style="min-height: 20px; border-bottom: 2px solid var(--border);" id="command-area">
        <form onSubmit="run_command(event)" style="display: flex; flex-direction: row; min-width: 100%">
            <label for="command"></label><input type="text" name="command" id="command" placeholder="/..." autocomplete="off" style="border: #00000000; background: #00000000; flex-grow: 1;">
            <button type="submit" style="min-width: 80px; max-width: 80px; border: none; background: #00000000; color: #ffffff" id="run">
                <svgfrom src="send-horizontal.svg"></svgfrom>
            </button>
        </form>
    </div>
</div>
<script type="text/javascript">
    const params = new URLSearchParams(window.location.search);
    const can_send_command = !(params.get("send_command") !== "true");
    const file_name = params.get("name");
    const live = !(params.get("live") !== "true");

    if (!can_send_command) {
        document.getElementById("command-area").remove();
        document.getElementById("log-size").style.height = "100vh"
    }

    async function run_command(event) {
        event.preventDefault();

        request_data("POST", "api/send_command", document.getElementById("command").value, async (out) => {});
    }

    document.addEventListener("status_update", (event) => {
        if(can_send_command) document.getElementById("run").disabled = !event.detail.status_online
    });

    let current_line = -1;

    if(live) {
        let logsStream = new EventSource("api/live_logs", {
            withCredentials: true
        });
        logsStream.onmessage = (event) => {
            handle_lines(event.data.replaceAll("\\n", "\n"), false);
        };
        logsStream.onerror = (error) => {
            console.error("Error in EventSource:", error);
        };
    } else {
        //current_line = 0;
        request_params("GET", "api/log_line_count", {
            path: file_name
        }, async (out) => {
            if(out.success) {
                current_line = parseInt(out.as_text());
            }
        });
    }

    let is_refreshing = false;

    let refresh_lines = setInterval(() => {
        if(current_line === -1 || is_refreshing) return;
        if(document.getElementById("log-div").scrollTop < 100) {
            is_refreshing = true;
            let length = 100;
            let get_from = current_line - length;
            if(get_from < 0) {
                clearInterval(refresh_lines);
                length += get_from;
                get_from = 0;
            }
            request_params("GET", "api/read_log", {
                start: get_from,
                lines: length,
                name: file_name
            }, async (out) => {
                is_refreshing = false;
                if(out.success) {
                    current_line = get_from;
                    handle_lines(out.as_text(), true);
                }
            });
        }
    }, 10);

    function handle_lines(combined, prepend) {
        let setScroll = false;
        let oldHeight = document.getElementById("log-div").clientHeight;
        if ((document.getElementById("log-div").scrollTop) / (document.getElementById("log-div").scrollHeight - document.getElementById("log-div").clientHeight) === 1) setScroll = true;

        handle_lines2(combined, prepend)

        if(prepend) {
            if(oldHeight === 0) document.getElementById("log-div").scrollTop = document.getElementById("log-div").clientHeight;
            else document.getElementById("log-div").scrollTop -= (document.getElementById("log-div").scrollTop - oldHeight);
        } else {
            if (oldHeight !== document.getElementById("log-div").scrollHeight && !document.getElementById("log-div").dataset.hasScrolled) {
                setScroll = true;
                document.getElementById("log-div").dataset.hasScrolled = true;
            }
            if (setScroll) document.getElementById("log-div").scrollTop = 9999999999;
        }
    }

    function handle_lines2(combined, prepend) {
        let lines = combined.split("\n");

        if(prepend) lines = lines.reverse();

        lines.forEach((line) => {
            if(line === "#### CLEAR MANAGER LOGS ####") {
                document.getElementById('log-div').replaceChildren();
            } else if(line.startsWith("#### MANAGER LOG LINE: ")) {
                current_line = parseInt(line.replace("#### MANAGER LOG LINE: ", "").replace(" ####", ""));
            } else {
                let slash = line.indexOf("/");
                let prefix = line.substring(slash + 1, line.indexOf("]", slash));
                let style = "";
                if (prefix === "INFO") {
                    style = "color: lime";
                } else if (prefix === "WARN") {
                    style = "color: orange";
                } else if (prefix === "FATAL") {
                    style = "color: red; background: #5d0202";
                } else if (prefix === "ERROR") {
                    style = "color: red";
                }
                let element = document.createElement('p');
                element.textContent = line;
                element.style = style + "; margin: 2px";
                if(prepend) {
                    document.getElementById('log-div').prepend(element);
                } else {
                    document.getElementById('log-div').appendChild(element);
                }
            }
        })
    }
</script>
</body>
</html>
